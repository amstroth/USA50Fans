name: USA50 app validation
on:
  push:
    branches: [main]
    paths:
      - server.js
      - role-features.js
      - social-hub.js
      - card-studio.js
      - www/**
      - package.json
      - tests/**
      - .github/workflows/ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
