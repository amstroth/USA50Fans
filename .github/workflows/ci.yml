name: USA50 app validation
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - Dockerfile
      - 'www/**'
      - package.json
      - package-lock.json
      - 'tests/**'
      - .github/workflows/ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
