name: Install verified USA50 pack MP4
on:
  push:
    branches: [main]
    paths: [".github/workflows/install-pack-mp4.yml"]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Runway-generated animation
        shell: bash
        run: |
          set -euo pipefail
          source_url=$(grep -m1 'SOURCE: "https://dnznrvs05pmza.cloudfront.net/' .github/workflows/import-pack-animation.yml | cut -d '"' -f2)
          test -n "$source_url"
          mkdir -p www/assets/video
          curl --fail --silent --show-error --location --retry 3 --max-time 180 "$source_url" -o www/assets/video/pack-opening-v07.mp4
          test "$(stat -c%s www/assets/video/pack-opening-v07.mp4)" -gt 10000
          test "$(stat -c%s www/assets/video/pack-opening-v07.mp4)" -lt 100000000
          file --mime-type www/assets/video/pack-opening-v07.mp4 | grep -q 'video/mp4'
      - name: Commit persistent animation asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/assets/video/pack-opening-v07.mp4
          git diff --cached --quiet || git commit -m "assets: install rendered USA50 pack-opening animation"
          git push origin HEAD:main
