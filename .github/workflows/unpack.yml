name: Expand and test USA50 sources
on:
  push:
    branches: [main]
    paths:
      - source_payload.b64
      - .github/workflows/unpack.yml
      - scripts/unpack.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Expand original project
        run: node scripts/unpack.mjs
      - name: Verify code and business-rule tests
        run: |
          npm run check
          npm test
      - name: Commit editable source and preview graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- server.js www docs tests capacitor.config.json
          if ! git diff --cached --quiet; then
            git commit -m "Expand tested USA50 web app sources"
            git push
          fi
