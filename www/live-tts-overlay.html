<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>USA50 Live TTS · Private OBS overlay</title>
<link rel="stylesheet" href="/live-tts-overlay.css?v=1">
<script defer src="/live-tts-overlay.js?v=1"></script>
</head>
<body>
  <main class="overlay">
    <div id="tts-status" class="tts-status">USA50 TTS overlay · Connecting…</div>
    <div id="tts-bubble" class="tts-bubble" hidden><strong id="tts-name"></strong><p id="tts-text"></p></div>
    <div class="tts-enable" id="tts-enable">
      <h2>USA50 Live Gift TTS</h2><p>In OBS, right-click this Browser Source → Interact, then select Enable TTS. Configure the source to allow audio in the broadcast.</p>
      <button id="tts-start">Enable TTS audio</button>
    </div>
  </main>
</body></html>
